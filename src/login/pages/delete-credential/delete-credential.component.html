@let url = kcContext.url;
@let credentialLabel = kcContext.credentialLabel;
@let realm = kcContext.realm;

<ng-template #headerNode>
  {{ i18n.advancedMsgStr('deleteCredentialTitle', [credentialLabel]) }}
</ng-template>

<div class="kc-page-card">
  <div class="kc-page-brand">
    <div
      class="kc-page-logo"
      [innerHTML]="realm.displayNameHtml ?? '' | kcSanitize: 'html'"
    ></div>
    <h1 class="kc-page-title"><ng-container [ngTemplateOutlet]="headerNode" /></h1>
  </div>

  <div class="kc-page-form">
    <div class="kc-page-form-layout">
      <div class="kc-form-content">
        <p class="kc-instruction">
          {{ i18n.advancedMsgStr('deleteCredentialMessage', [credentialLabel]) }}
        </p>
      </div>

      <div class="kc-form-submit">
        <form
          method="post"
          [action]="url.loginAction"
          style="display: contents"
        >
          <button
            mat-stroked-button
            type="submit"
            name="cancel-aia"
            value="true"
            id="kc-decline"
          >
            {{ i18n.msgStr('doCancel') }}
          </button>
          <button
            mat-flat-button
            color="warn"
            type="submit"
            name="accept"
            id="kc-accept"
          >
            {{ i18n.msgStr('doConfirmDelete') }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
