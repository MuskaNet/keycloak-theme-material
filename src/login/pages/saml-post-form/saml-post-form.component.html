@let samlPost = kcContext.samlPost;

<ng-template #headerNode>
  {{ i18n.msgStr('saml.post-form.title') }}
</ng-template>

<div class="kc-page-card">
  <div class="kc-page-brand">
    <h1 class="kc-page-title"><ng-container [ngTemplateOutlet]="headerNode" /></h1>
  </div>
  <div class="kc-page-form">
    <div class="kc-page-form-layout">
      <div class="kc-form-content">
        <p class="kc-instruction">{{ i18n.msgStr('saml.post-form.message') }}</p>
        <form
          #samlForm
          name="saml-post-binding"
          method="post"
          [action]="samlPost.url"
        >
          @if (!!samlPost.SAMLRequest) {
            <input
              type="hidden"
              name="SAMLRequest"
              [value]="samlPost.SAMLRequest"
            />
          }
          @if (!!samlPost.SAMLResponse) {
            <input
              type="hidden"
              name="SAMLResponse"
              [value]="samlPost.SAMLResponse"
            />
          }
          @if (!!samlPost.relayState) {
            <input
              type="hidden"
              name="RelayState"
              [value]="samlPost.relayState"
            />
          }
          <noscript>
            <p>{{ i18n.msgStr('saml.post-form.js-disabled') }}</p>
            <button
              mat-flat-button
              color="primary"
              type="submit"
            >
              {{ i18n.msgStr('doContinue') }}
            </button>
          </noscript>
        </form>
      </div>
    </div>
  </div>
</div>
